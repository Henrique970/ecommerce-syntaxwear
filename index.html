<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntaxwear - Tênis e Snmeakers Online</title>

    <meta name="description"
        content="Compre os melhores tênis e sneakers online na Syntaxwear. Encontre os últimos lançamentos, estilos exclusivos e ofertas imperdíveis. Sua jornada para o par perfeito começa aqui!">

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">

    <link rel="stylesheet" href="./css/components/header.css">
    <link rel="stylesheet" href="./css/components/hero.css">
    <link rel="stylesheet" href="./css/components/product-category.css">


</head>

<body>

    <!-- Conteúdo da homepage -->
    <header class="header">
        <!-- Logo e Navegação -->
        <h1 class="logo">
            <a href="/" title="Syntaxwear - Tênis e Snmeakers Online">
                <img src="./images/logo/logo.svg" alt="Syntaxwear - Tênis e Snmeakers Online">
            </a>
        </h1>

        <nav class="nav-center" aria-label="Categorias Principais">
            <ul>
                <li><a href="#">Masculino</a></li>
                <li><a href="#">Feminino</a></li>
                <li><a href="#">Outlet</a></li>
            </ul>

        </nav>

        <nav class="nav-right" aria-label="Acesso Rápido">
            <ul>
                <li><a href="#">Nossas Lojas</a></li>
                <li><a href="#">Sobre</a></li>
                <li>
                    <a href="#" aria-label="Minha Conta">
                        <img src="./images/icons/user.svg" alt="Minha Conta">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Ajuda">
                        <img src="./images/icons/help.svg" alt="Ajuda">
                    </a>
                </li>
                <li>
                    <a href="#" aria-label="Carrinho">
                        <img src="./images/icons/bag.svg" alt="Carrinho">
                    </a>
                </li>

            </ul>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <!-- Seção do hero -->
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença.</h2>

                    <div class="hero-buttons">
                        <a href="#" class="btn btn-outline">Ver modelos</a>
                        <a href="#" class="btn btn-filled">Comprar</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="categories-section">
            <!-- Seção de produtos -->

            <div class="category-card casual">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Casual</span>
                </a>
            </div>
            <div class="category-card esporte">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Esporte</span>
                </a>
            </div>
            <div class="category-card moderno">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Moderno</span>
                </a>
            </div>
            <div class="category-card futurista">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name btn btn-outline">Futurista</span>
                </a>
            </div>

        </section>

        <section class="featured-products-section">
            <!-- Grid com produtos em destaque -->
        </section>
    </main>

    <footer class="site-footer">
        <!-- Informações de contatos e links -->
    </footer>

</body>

</html>
